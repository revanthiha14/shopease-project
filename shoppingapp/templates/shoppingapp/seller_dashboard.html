{% extends 'shoppingapp/base.html' %}

{% block content %}

<h1>
    Seller Dashboard
</h1>

<div style="
margin-bottom:30px;
">

    <a href="/seller-add-product/">

        <button style="
        background:#2563eb;
        color:white;
        border:none;
        padding:15px 30px;
        border-radius:10px;
        font-size:18px;
        cursor:pointer;
        ">

            Add Product

        </button>

    </a>

</div>

<div style="
display:grid;
grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
gap:30px;
">

{% for product in products %}

<div style="
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px lightgray;
">

    <img
    src="{{ product.image_url }}"

    style="
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
    ">

    <h2 style="
    margin-top:20px;
    ">

        {{ product.name }}

    </h2>

    <p>
        Category:
        {{ product.category }}
    </p>

    <p>
        Price:
        ₹{{ product.price }}
    </p>

    <p>
        Stock:
        {{ product.stock }}
    </p>

</div>

{% empty %}

<h3>
    No products added yet
</h3>

{% endfor %}

</div>

{% endblock %}
