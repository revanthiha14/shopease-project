{% extends 'shoppingapp/base.html' %}

{% block content %}

<div class="container">

    <div class="product-card">

        <h1>Seller Login</h1>

        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   name="username"
                   placeholder="Enter Seller Name">

            <br>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
