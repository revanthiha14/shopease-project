{% extends 'shoppingapp/base.html' %}

{% block content %}

<div
style="
    width:400px;
    margin:auto;
    background:white;
    padding:40px;
    border-radius:10px;
"
>

<h1>Register</h1>

<form method="POST">

    {% csrf_token %}

    <input
    type="text"
    name="username"
    placeholder="Username"
    required
    >

    <br><br>

    <input
    type="email"
    name="email"
    placeholder="Email"
    required
    >

    <br><br>

    <input
    type="password"
    name="password"
    placeholder="Password"
    required
    >

    <br><br>

    <button type="submit">

        Register

    </button>

</form>

<br>

<a href="/login/">

Already have account?

</a>

</div>

{% endblock %}
