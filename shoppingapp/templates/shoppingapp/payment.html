{% extends 'shoppingapp/base.html' %}

{% block content %}

<h1>Checkout</h1>

<div class="product-card">

<h2>Total Amount: ₹{{ total }}</h2>

<form method="POST">

    {% csrf_token %}

    <input
    type="text"
    placeholder="Card Number"
    required
    >

    <br>

    <input
    type="text"
    placeholder="Card Holder Name"
    required
    >

    <br>

    <input
    type="text"
    placeholder="CVV"
    required
    >

    <br>

    <button type="submit">

        Pay Now

    </button>

</form>

</div>

{% endblock %}
